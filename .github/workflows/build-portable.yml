name: build-portable

# 打 tag（v1.0.0 这种）时自动出一个免安装 zip，挂到 Release 上，
# 这样别人不用装 Python 也能直接下载即用。
#
# 也可以手动触发：Actions 页面 → build-portable → Run workflow。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python（打包用的运行时素材）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # setup-python 装的是标准 CPython，自带 Lib / DLLs / tcl / tkinter，
      # 正是 build-portable.ps1 需要的素材。
      - name: 找到运行时目录
        id: rt
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $dir = Split-Path -Parent $py
          Write-Host "runtime = $dir"
          Get-ChildItem $dir | Select-Object -First 20 Name
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: 先跑自测套件
        shell: pwsh
        run: |
          python -m gpucore.tests.test_gpucore

      - name: 打包免安装版
        shell: pwsh
        run: |
          ./packaging/build-portable.ps1 -RuntimeDir "${{ steps.rt.outputs.dir }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GpuCore-portable
          path: dist/*.zip
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## 免安装版（推荐）

            下载下面的 `GpuCore-*-portable.zip`，解压到任意目录，双击 `GpuCore.exe`。
            **不需要安装 Python**，不需要管理员权限，删掉文件夹即卸载。

            首次使用前建议跑一下自检，把输出发到 issue 里：

            ```
            GpuCore.exe --check
            ```

            硬件切换目前只在华硕机型上可用；其他机型会自动把切换按钮置灰，监视功能照常。
