name: build-portable


on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python（打包用的运行时素材）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 找到运行时目录
        id: rt
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $dir = Split-Path -Parent $py
          Write-Host "runtime = $dir"
          Get-ChildItem $dir | Select-Object -First 20 Name
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: 先跑自测套件
        shell: pwsh
        run: |
          python -m gpucore.tests.test_gpucore

      - name: 打包免安装版
        shell: pwsh
        run: |
          ./packaging/build-portable.ps1 -RuntimeDir "${{ steps.rt.outputs.dir }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GpuCore-portable
          path: dist/*.zip
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
