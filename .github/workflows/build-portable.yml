name: build-portable

# 打 tag（v1.0.0 这种）时自动出一个免安装 zip，挂到 Release 上，
# 这样别人不用装 Python 也能直接下载即用。
#
# 也可以手动触发：Actions 页面 → build-portable → Run workflow。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python（打包用的运行时素材）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # setup-python 装的是标准 CPython，自带 Lib / DLLs / tcl / tkinter，
      # 正是 build-portable.ps1 需要的素材。
      - name: 找到运行时目录
        id: rt
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $dir = Split-Path -Parent $py
          Write-Host "runtime = $dir"
          Get-ChildItem $dir | Select-Object -First 20 Name
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: 先跑自测套件
        shell: pwsh
        run: |
          python -m gpucore.tests.test_gpucore

      - name: 打包免安装版
        shell: pwsh
        run: |
          ./packaging/build-portable.ps1 -RuntimeDir "${{ steps.rt.outputs.dir }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GpuCore-portable
          path: dist/*.zip
          if-no-files-found: error

      # 注意：这里**不要**用 generate_release_notes，也不要用 body 覆盖，
      # 因为这个 workflow 常常是补挂到一条已经手工建好的 Release 上的
      # （先发 Release，再推 tag 触发打包）。带上 body 会把人写好的发布说明冲掉。
      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
